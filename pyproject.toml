[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantora"
version = "0.2.0"
description = "Production-grade LLM performance engineering, quantization benchmarking, and efficiency analytics suite."
readme = "README.md"
authors = [
  { name = "Tanish Kumar" }
]
license = { text = "MIT" }
keywords = ["llm", "quantization", "benchmarking", "vram", "throughput", "kv-cache", "perplexity", "transformers", "pytorch"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2.0",
  "transformers>=4.40.0",
  "accelerate>=0.28.0",
  "peft>=0.10.0",
  "bitsandbytes>=0.43.0",
  "streamlit>=1.30.0",
  "plotly>=5.18.0",
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "psutil>=5.9.0",
  "evaluate>=0.4.0",
  "rouge-score>=0.1.2",
]

[project.urls]
Homepage = "https://github.com/Tanish-o9/QUANTORA"
Repository = "https://github.com/Tanish-o9/QUANTORA"
Issues = "https://github.com/Tanish-o9/QUANTORA/issues"

[project.scripts]
quantora = "cli:main"

[tool.setuptools]
py-modules = [
  "app",
  "server",
  "cli",
  "model_engine",
  "benchmark_engine",
  "optimizer",
  "evaluator",
  "storage",
  "run_benchmark",
]

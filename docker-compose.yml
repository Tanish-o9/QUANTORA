services:
  quantora-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: quantora-api:latest
    container_name: quantora-api
    ports:
      - "8000:8000"
    environment:
      - QUANTORA_HOST=0.0.0.0
      - QUANTORA_PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./results:/app/results
      - ./data:/app/data
    restart: unless-stopped
    # Uncomment the following block for NVIDIA GPU hardware acceleration:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  quantora-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: quantora-web:latest
    container_name: quantora-web
    ports:
      - "3000:80"
    depends_on:
      - quantora-api
    restart: unless-stopped

services:
  quantora:
    build:
      context: .
      dockerfile: Dockerfile
    image: quantora:latest
    container_name: quantora-lab
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    volumes:
      - ./results:/app/results
      - ./data:/app/data
    restart: unless-stopped
    # Uncomment the following block if running on a host with NVIDIA Container Toolkit for GPU passthrough:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

